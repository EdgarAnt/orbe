<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbe RA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      color: #eaf6ff;
      background: radial-gradient(ellipse at center, #0b1622 0%, #000 75%);
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      z-index: 10;
    }
    #overlay h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #overlay p {
      margin: 0;
      max-width: 28rem;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #9db3c4;
    }
    #enter-ar {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #04121c;
      background: linear-gradient(135deg, #7fe3ff, #66ccff);
      cursor: pointer;
      box-shadow: 0 0 24px rgba(102, 204, 255, 0.45);
    }
    #enter-ar:active { transform: scale(0.97); }
    #enter-ar[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    #xr-status {
      font-size: 0.85rem;
      color: #ff8a8a;
      max-width: 24rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>Orbe RA</h1>
    <p>Un orbe flota frente a vos. Pellizcalo con el pulgar y el índice de la mano derecha para agarrarlo, y volvé a pellizcar para soltarlo.</p>
    <button id="enter-ar">Entrar en RA</button>
    <div id="xr-status"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    // ------------------------------------------------------------------
    // Constantes de ajuste — todo lo que probablemente quieras tocar
    // ------------------------------------------------------------------
    const CONFIG = {
      HAND_JOINT: "middle-finger-phalanx-proximal", // nudillo medio: más centrado en la palma que el metacarpal (que cae cerca de la muñeca)
      ORB_OFFSET_Y: 0.10,       // metros por encima del joint

      CORE_RADIUS: 0.018,       // radio del núcleo sólido (m)
      HALO_SCALE: 1.8,          // halo = CORE_RADIUS * HALO_SCALE
      HALO_OPACITY: 0.35,

      COLOR: 0x66ccff,

      // Cáscara de píxeles estilo plasma
      PLASMA_COUNT: 200,           // píxeles por orbe
      PLASMA_RADIUS_SCALE: 3.2,    // radio de la cáscara = CORE_RADIUS * esto
      PLASMA_JITTER: 0.28,         // variación de radio por píxel al crearse (0..1)
      PLASMA_PIXEL_SIZE: 0.006,    // tamaño de cada píxel (m)
      PLASMA_WOBBLE_AMOUNT: 0.35,  // cuánto "hierve" cada píxel respecto a su radio base (0..1)
      PLASMA_WOBBLE_SPEED: 1.6,    // velocidad de la ebullición
      PLASMA_COLOR_A: 0x66ccff,    // color en un polo de la esfera
      PLASMA_COLOR_B: 0xff4fd8,    // color en el polo opuesto — degradé estilo plasma

      SMOOTHING_RATE: 12,       // más alto = el orbe sigue el objetivo más rápido

      // Dónde flota el orbe cuando no está agarrado (espacio local-floor:
      // Y = altura desde el piso, Z negativo = adelante de donde arrancó la sesión)
      FLOAT_ANCHOR_X: 0,
      FLOAT_ANCHOR_Y: 1.3,
      FLOAT_ANCHOR_Z: -0.45,
      FLOAT_BOB_AMPLITUDE: 0.025, // metros que sube y baja mientras flota
      FLOAT_BOB_SPEED: 1.2,       // rad/seg del vaivén

      // Agarrar / soltar con pellizco (pulgar + índice) de la mano derecha
      PINCH_DISTANCE: 0.025, // distancia (m) pulgar-índice para contar como pellizco
      GRAB_RADIUS: 0.06,     // distancia (m) máxima entre el pellizco y el orbe para poder agarrarlo
    };

    // ------------------------------------------------------------------
    // Escena base
    // ------------------------------------------------------------------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // transparente: se ve el passthrough detrás
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local-floor");
    document.body.appendChild(renderer.domElement);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ------------------------------------------------------------------
    // Distribución pareja de puntos sobre una esfera (esfera de Fibonacci),
    // con un poco de jitter radial para que la cáscara de píxeles no se
    // vea perfectamente geométrica.
    // ------------------------------------------------------------------
    function createPlasmaShellPositions(count, radius, jitter) {
      const basePositions = new Float32Array(count * 3); // radio de reposo ya aplicado
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < count; i++) {
        const y = 1 - (i / (count - 1)) * 2; // -1..1
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = goldenAngle * i;
        const r = radius * (1 - jitter / 2 + Math.random() * jitter);

        basePositions[i * 3 + 0] = Math.cos(theta) * radiusAtY * r;
        basePositions[i * 3 + 1] = y * r;
        basePositions[i * 3 + 2] = Math.sin(theta) * radiusAtY * r;
      }
      return basePositions;
    }

    // ------------------------------------------------------------------
    // Orbe: núcleo + halo aditivo + cáscara de píxeles tipo plasma.
    // Sin luces.
    // ------------------------------------------------------------------
    function createOrb() {
      const group = new THREE.Group();

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(CONFIG.CORE_RADIUS, 24, 16),
        new THREE.MeshBasicMaterial({ color: CONFIG.COLOR })
      );

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(CONFIG.CORE_RADIUS * CONFIG.HALO_SCALE, 24, 16),
        new THREE.MeshBasicMaterial({
          color: CONFIG.COLOR,
          transparent: true,
          opacity: CONFIG.HALO_OPACITY,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );

      // Cáscara de píxeles: cada uno "hierve" hacia adentro/afuera de su
      // propio radio de reposo. basePositions guarda ese radio de reposo;
      // el atributo `position` del BufferGeometry se reescribe cada frame.
      const plasmaRadius = CONFIG.CORE_RADIUS * CONFIG.PLASMA_RADIUS_SCALE;
      const basePositions = createPlasmaShellPositions(
        CONFIG.PLASMA_COUNT,
        plasmaRadius,
        CONFIG.PLASMA_JITTER
      );

      const phases = new Float32Array(CONFIG.PLASMA_COUNT);
      const speeds = new Float32Array(CONFIG.PLASMA_COUNT);
      const colors = new Float32Array(CONFIG.PLASMA_COUNT * 3);
      const colorA = new THREE.Color(CONFIG.PLASMA_COLOR_A);
      const colorB = new THREE.Color(CONFIG.PLASMA_COLOR_B);
      const tmpColor = new THREE.Color();

      for (let i = 0; i < CONFIG.PLASMA_COUNT; i++) {
        phases[i] = Math.random() * Math.PI * 2;
        speeds[i] = 0.6 + Math.random() * 0.8;

        const y = basePositions[i * 3 + 1] / plasmaRadius; // -1..1
        tmpColor.copy(colorA).lerp(colorB, (y + 1) / 2);
        colors[i * 3 + 0] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;
      }

      const plasmaGeometry = new THREE.BufferGeometry();
      const positionAttribute = new THREE.BufferAttribute(basePositions.slice(), 3);
      positionAttribute.usage = THREE.DynamicDrawUsage;
      plasmaGeometry.setAttribute("position", positionAttribute);
      plasmaGeometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const plasma = new THREE.Points(
        plasmaGeometry,
        new THREE.PointsMaterial({
          size: CONFIG.PLASMA_PIXEL_SIZE,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );

      group.add(core, halo, plasma);
      group.userData.plasma = { points: plasma, basePositions, phases, speeds };
      return group;
    }

    // ------------------------------------------------------------------
    // Actualiza la cáscara de píxeles: cada uno oscila radialmente sobre
    // su propio radio de reposo, con fase y velocidad propias. Escribe
    // directamente sobre el array existente — no crea memoria nueva.
    // ------------------------------------------------------------------
    function updatePlasma(plasma, elapsedTime) {
      const positions = plasma.points.geometry.attributes.position.array;
      const { basePositions, phases, speeds } = plasma;

      for (let i = 0; i < phases.length; i++) {
        const wobble =
          1 +
          CONFIG.PLASMA_WOBBLE_AMOUNT *
            Math.sin(elapsedTime * CONFIG.PLASMA_WOBBLE_SPEED * speeds[i] + phases[i]);

        positions[i * 3 + 0] = basePositions[i * 3 + 0] * wobble;
        positions[i * 3 + 1] = basePositions[i * 3 + 1] * wobble;
        positions[i * 3 + 2] = basePositions[i * 3 + 2] * wobble;
      }

      plasma.points.geometry.attributes.position.needsUpdate = true;
    }

    // ------------------------------------------------------------------
    // Manos — se agregan las dos (three.js necesita esto para actualizar
    // los joints), pero solo usamos la que resulte ser la derecha, según
    // el evento "connected" de WebXR (el índice 0/1 no garantiza mano).
    // ------------------------------------------------------------------
    const handCandidates = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    let rightHand = null;

    for (const hand of handCandidates) {
      scene.add(hand);
      hand.addEventListener("connected", (event) => {
        if (event.data.handedness === "right") rightHand = hand;
      });
      hand.addEventListener("disconnected", () => {
        if (rightHand === hand) rightHand = null;
      });
    }

    // Un solo orbe. Arranca flotando en su posición de reposo (sin lerp
    // inicial desde el origen, para que no "vuele" al entrar en RA).
    const orb = createOrb();
    scene.add(orb);

    const ORB_STATE = { FLOATING: "floating", HELD: "held" };
    let orbState = ORB_STATE.FLOATING;
    let wasPinching = false;

    // ------------------------------------------------------------------
    // Loop de render — sin asignaciones de memoria por frame
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();
    const _jointPos = new THREE.Vector3();
    const _thumbPos = new THREE.Vector3();
    const _indexPos = new THREE.Vector3();
    const _pinchMid = new THREE.Vector3();
    const _floatAnchor = new THREE.Vector3(
      CONFIG.FLOAT_ANCHOR_X,
      CONFIG.FLOAT_ANCHOR_Y,
      CONFIG.FLOAT_ANCHOR_Z
    );
    orb.position.copy(_floatAnchor);

    // Pellizco de la mano derecha: distancia pulgar-índice. Deja el
    // resultado en variables reutilizadas en vez de devolver un objeto.
    let pinchActive = false;
    function samplePinch() {
      if (!rightHand) {
        pinchActive = false;
        return;
      }
      const thumb = rightHand.joints["thumb-tip"];
      const index = rightHand.joints["index-finger-tip"];
      if (!thumb || !index || !thumb.visible || !index.visible) {
        pinchActive = false;
        return;
      }
      thumb.getWorldPosition(_thumbPos);
      index.getWorldPosition(_indexPos);
      _pinchMid.copy(_thumbPos).add(_indexPos).multiplyScalar(0.5);
      pinchActive = _thumbPos.distanceTo(_indexPos) < CONFIG.PINCH_DISTANCE;
    }

    function render() {
      const dt = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();
      const lerpAlpha = 1 - Math.exp(-CONFIG.SMOOTHING_RATE * dt);

      samplePinch();
      const pinchStarted = pinchActive && !wasPinching;
      wasPinching = pinchActive;

      if (orbState === ORB_STATE.FLOATING && pinchStarted) {
        if (_pinchMid.distanceTo(orb.position) < CONFIG.GRAB_RADIUS) {
          orbState = ORB_STATE.HELD; // lo agarraste
        }
      } else if (orbState === ORB_STATE.HELD && pinchStarted) {
        orbState = ORB_STATE.FLOATING; // te lo quitaste: queda flotando ahí mismo
        _floatAnchor.copy(orb.position);
      }

      if (orbState === ORB_STATE.HELD) {
        const joint = rightHand && rightHand.joints[CONFIG.HAND_JOINT];
        if (joint && joint.visible) {
          joint.getWorldPosition(_jointPos);
          _jointPos.y += CONFIG.ORB_OFFSET_Y;
          orb.position.lerp(_jointPos, lerpAlpha);
        }
        // si se pierde el tracking de la mano, el orbe se queda quieto
      } else {
        _jointPos.copy(_floatAnchor);
        _jointPos.y += Math.sin(elapsedTime * CONFIG.FLOAT_BOB_SPEED) * CONFIG.FLOAT_BOB_AMPLITUDE;
        orb.position.lerp(_jointPos, lerpAlpha);
      }

      updatePlasma(orb.userData.plasma, elapsedTime);
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(render);

    // ------------------------------------------------------------------
    // UI: entrada / salida de sesión y manejo de "no soportado"
    // ------------------------------------------------------------------
    const overlay = document.getElementById("overlay");
    const enterButton = document.getElementById("enter-ar");
    const statusEl = document.getElementById("xr-status");

    function showUnsupported(message) {
      statusEl.textContent = message;
      enterButton.disabled = true;
    }

    if (!navigator.xr) {
      showUnsupported(
        "WebXR no está disponible en este navegador. Abrí esta página en el navegador del Meta Quest."
      );
    } else {
      navigator.xr.isSessionSupported("immersive-ar").then((supported) => {
        if (!supported) {
          showUnsupported("Este dispositivo no soporta realidad aumentada (immersive-ar).");
        }
      });
    }

    async function enterAR() {
      statusEl.textContent = "";
      try {
        const session = await navigator.xr.requestSession("immersive-ar", {
          optionalFeatures: ["hand-tracking", "local-floor"],
        });

        renderer.xr.addEventListener("sessionend", onSessionEnd, { once: true });

        await renderer.xr.setSession(session);
        overlay.style.display = "none";
      } catch (err) {
        showUnsupported("No se pudo iniciar la sesión de RA: " + err.message);
      }
    }

    function onSessionEnd() {
      overlay.style.display = "flex";
    }

    enterButton.addEventListener("click", enterAR);
  </script>
</body>
</html>
