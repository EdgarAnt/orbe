<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbe RA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      color: #eaf6ff;
      background: radial-gradient(ellipse at center, #0b1622 0%, #000 75%);
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      z-index: 10;
    }
    #overlay h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #overlay p {
      margin: 0;
      max-width: 28rem;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #9db3c4;
    }
    #enter-ar {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #04121c;
      background: linear-gradient(135deg, #7fe3ff, #66ccff);
      cursor: pointer;
      box-shadow: 0 0 24px rgba(102, 204, 255, 0.45);
    }
    #enter-ar:active { transform: scale(0.97); }
    #enter-ar[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    #xr-status {
      font-size: 0.85rem;
      color: #ff8a8a;
      max-width: 24rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>Orbe RA</h1>
    <p>Un orbe flota frente a vos. Pellizcalo con el pulgar y el índice de la mano derecha para agarrarlo, volvé a pellizcar para soltarlo, y cerrá el puño mientras lo tenés agarrado para romperlo, escanear el cuarto y guardar una maqueta chica adentro.</p>
    <button id="enter-ar">Entrar en RA</button>
    <div id="xr-status"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    // ------------------------------------------------------------------
    // Constantes de ajuste — todo lo que probablemente quieras tocar
    // ------------------------------------------------------------------
    const CONFIG = {
      HAND_JOINT: "middle-finger-phalanx-proximal", // nudillo medio: más centrado en la palma que el metacarpal (que cae cerca de la muñeca)
      ORB_OFFSET_Y: 0.10,       // metros por encima del joint

      CORE_RADIUS: 0.018,       // radio del núcleo sólido (m)
      HALO_SCALE: 1.8,          // halo = CORE_RADIUS * HALO_SCALE
      HALO_OPACITY: 0.35,

      COLOR: 0x66ccff,

      // Cáscara de píxeles estilo plasma
      PLASMA_COUNT: 200,           // píxeles por orbe
      PLASMA_RADIUS_SCALE: 3.2,    // radio de la cáscara = CORE_RADIUS * esto
      PLASMA_JITTER: 0.28,         // variación de radio por píxel al crearse (0..1)
      PLASMA_PIXEL_SIZE: 0.006,    // tamaño de cada píxel (m)
      PLASMA_WOBBLE_AMOUNT: 0.35,  // cuánto "hierve" cada píxel respecto a su radio base (0..1)
      PLASMA_WOBBLE_SPEED: 1.6,    // velocidad de la ebullición
      PLASMA_COLOR_A: 0x66ccff,    // color en un polo de la esfera
      PLASMA_COLOR_B: 0xff4fd8,    // color en el polo opuesto — degradé estilo plasma

      SMOOTHING_RATE: 12,       // más alto = el orbe sigue el objetivo más rápido

      // Dónde flota el orbe cuando no está agarrado (espacio local-floor:
      // Y = altura desde el piso, Z negativo = adelante de donde arrancó la sesión)
      FLOAT_ANCHOR_X: 0,
      FLOAT_ANCHOR_Y: 1.3,
      FLOAT_ANCHOR_Z: -0.45,
      FLOAT_BOB_AMPLITUDE: 0.025, // metros que sube y baja mientras flota
      FLOAT_BOB_SPEED: 1.2,       // rad/seg del vaivén

      // Agarrar / soltar con pellizco (pulgar + índice) de la mano derecha
      PINCH_DISTANCE: 0.025, // distancia (m) pulgar-índice para contar como pellizco
      GRAB_RADIUS: 0.06,     // distancia (m) máxima entre el pellizco y el orbe para poder agarrarlo

      // Oclusión: qué tan "gorda" es la mano invisible que tapa al orbe
      // cuando pasa por delante (1 = grosor real estimado del hueso)
      OCCLUDER_RADIUS_SCALE: 1.35,

      // Puño cerrado (los 4 dedos, sin el pulgar) mientras tenés el orbe
      // agarrado: rompe el orbe y arranca el escaneo del cuarto
      FIST_TIP_TO_WRIST_THRESHOLD: 0.09, // debajo de esto (m) se considera puño cerrado

      // Ruptura del orbe: sus propios píxeles salen disparados y se apagan
      SHATTER_DURATION: 0.7,   // segundos hasta que termina de dispersarse
      SHATTER_SPEED: 0.9,      // m/seg, velocidad inicial de cada píxel
      SHATTER_GRAVITY: 0.6,    // m/seg², cae mientras se dispersa

      // Escaneo del cuarto (plane-detection + mesh-detection de WebXR)
      SCAN_COLOR: 0x33ffcc,        // color del láser y de las superficies reveladas
      SCAN_SWEEP_DURATION: 2.2,    // segundos del barrido de piso a techo
      SCAN_SURFACE_FADE_IN: 0.35,  // segundos en que una superficie aparece al ser "tocada"
      SCAN_LINGER: 2.0,            // segundos que queda todo visible tras el barrido
      SCAN_ROOM_HEIGHT: 2.5,       // alto asumido (m) si no hay geometría detectada
      SCAN_FILL_OPACITY: 0.16,     // opacidad de la superficie rellena de cada plano
      SCAN_WIRE_OPACITY: 0.75,     // opacidad de las líneas de wireframe

      // Maqueta: el cuarto escaneado se encoge hacia el orbe y queda
      // adentro, como una miniatura permanente
      MAQUETTE_SCALE: 0.06,             // tamaño final = tamaño real × esto
      MAQUETTE_COLLAPSE_DURATION: 1.2,  // segundos que tarda el zoom a miniatura
    };

    // ------------------------------------------------------------------
    // Escena base
    // ------------------------------------------------------------------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // transparente: se ve el passthrough detrás
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local-floor");
    document.body.appendChild(renderer.domElement);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ------------------------------------------------------------------
    // Textura circular para los píxeles del plasma (si no se le pasa un
    // mapa a PointsMaterial, three.js dibuja cuadrados). Se genera una
    // sola vez con canvas — sin depender de ningún archivo externo.
    // ------------------------------------------------------------------
    function createCircleTexture() {
      const size = 64;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
      );
      gradient.addColorStop(0, "rgba(255,255,255,1)");
      gradient.addColorStop(0.7, "rgba(255,255,255,1)");
      gradient.addColorStop(1, "rgba(255,255,255,0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      return new THREE.CanvasTexture(canvas);
    }
    const PIXEL_TEXTURE = createCircleTexture();

    // ------------------------------------------------------------------
    // Distribución pareja de puntos sobre una esfera (esfera de Fibonacci),
    // con un poco de jitter radial para que la cáscara de píxeles no se
    // vea perfectamente geométrica.
    // ------------------------------------------------------------------
    function createPlasmaShellPositions(count, radius, jitter) {
      const basePositions = new Float32Array(count * 3); // radio de reposo ya aplicado
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < count; i++) {
        const y = 1 - (i / (count - 1)) * 2; // -1..1
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = goldenAngle * i;
        const r = radius * (1 - jitter / 2 + Math.random() * jitter);

        basePositions[i * 3 + 0] = Math.cos(theta) * radiusAtY * r;
        basePositions[i * 3 + 1] = y * r;
        basePositions[i * 3 + 2] = Math.sin(theta) * radiusAtY * r;
      }
      return basePositions;
    }

    // ------------------------------------------------------------------
    // Orbe: núcleo + halo aditivo + cáscara de píxeles tipo plasma.
    // Sin luces.
    // ------------------------------------------------------------------
    function createOrb() {
      const group = new THREE.Group();

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(CONFIG.CORE_RADIUS, 24, 16),
        new THREE.MeshBasicMaterial({ color: CONFIG.COLOR })
      );

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(CONFIG.CORE_RADIUS * CONFIG.HALO_SCALE, 24, 16),
        new THREE.MeshBasicMaterial({
          color: CONFIG.COLOR,
          transparent: true,
          opacity: CONFIG.HALO_OPACITY,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );

      // Agrupados para poder "implosionarlos" (escala a 0) juntos al romperse
      const innerGlow = new THREE.Group();
      innerGlow.add(core, halo);

      // Cáscara de píxeles: cada uno "hierve" hacia adentro/afuera de su
      // propio radio de reposo. basePositions guarda ese radio de reposo;
      // el atributo `position` del BufferGeometry se reescribe cada frame.
      const plasmaRadius = CONFIG.CORE_RADIUS * CONFIG.PLASMA_RADIUS_SCALE;
      const basePositions = createPlasmaShellPositions(
        CONFIG.PLASMA_COUNT,
        plasmaRadius,
        CONFIG.PLASMA_JITTER
      );

      const phases = new Float32Array(CONFIG.PLASMA_COUNT);
      const speeds = new Float32Array(CONFIG.PLASMA_COUNT);
      const colors = new Float32Array(CONFIG.PLASMA_COUNT * 3);
      const colorA = new THREE.Color(CONFIG.PLASMA_COLOR_A);
      const colorB = new THREE.Color(CONFIG.PLASMA_COLOR_B);
      const tmpColor = new THREE.Color();

      for (let i = 0; i < CONFIG.PLASMA_COUNT; i++) {
        phases[i] = Math.random() * Math.PI * 2;
        speeds[i] = 0.6 + Math.random() * 0.8;

        const y = basePositions[i * 3 + 1] / plasmaRadius; // -1..1
        tmpColor.copy(colorA).lerp(colorB, (y + 1) / 2);
        colors[i * 3 + 0] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;
      }

      const plasmaGeometry = new THREE.BufferGeometry();
      const positionAttribute = new THREE.BufferAttribute(basePositions.slice(), 3);
      positionAttribute.usage = THREE.DynamicDrawUsage;
      plasmaGeometry.setAttribute("position", positionAttribute);
      plasmaGeometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const plasma = new THREE.Points(
        plasmaGeometry,
        new THREE.PointsMaterial({
          map: PIXEL_TEXTURE,
          size: CONFIG.PLASMA_PIXEL_SIZE,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );

      group.add(innerGlow, plasma);
      group.userData.innerGlow = innerGlow;
      group.userData.plasma = {
        points: plasma,
        basePositions,
        phases,
        speeds,
        velocities: new Float32Array(CONFIG.PLASMA_COUNT * 3), // se llena al romperse
      };
      return group;
    }

    // ------------------------------------------------------------------
    // Actualiza la cáscara de píxeles: cada uno oscila radialmente sobre
    // su propio radio de reposo, con fase y velocidad propias. Escribe
    // directamente sobre el array existente — no crea memoria nueva.
    // ------------------------------------------------------------------
    function updatePlasma(plasma, elapsedTime) {
      const positions = plasma.points.geometry.attributes.position.array;
      const { basePositions, phases, speeds } = plasma;

      for (let i = 0; i < phases.length; i++) {
        const wobble =
          1 +
          CONFIG.PLASMA_WOBBLE_AMOUNT *
            Math.sin(elapsedTime * CONFIG.PLASMA_WOBBLE_SPEED * speeds[i] + phases[i]);

        positions[i * 3 + 0] = basePositions[i * 3 + 0] * wobble;
        positions[i * 3 + 1] = basePositions[i * 3 + 1] * wobble;
        positions[i * 3 + 2] = basePositions[i * 3 + 2] * wobble;
      }

      plasma.points.geometry.attributes.position.needsUpdate = true;
    }

    // ------------------------------------------------------------------
    // Oclusión de manos: una esfera invisible (solo escribe profundidad,
    // no color) pegada a cada joint de la mano. Cuando la mano real pasa
    // delante del orbe, esta malla "gana" la prueba de profundidad y
    // tapa esa parte del orbe, dejando ver el passthrough (la mano real)
    // debajo — sin esto el orbe se dibuja siempre encima de todo.
    // ------------------------------------------------------------------
    const OCCLUDER_JOINT_NAMES = [
      "wrist",
      "thumb-metacarpal", "thumb-phalanx-proximal", "thumb-phalanx-distal", "thumb-tip",
      "index-finger-metacarpal", "index-finger-phalanx-proximal", "index-finger-phalanx-intermediate", "index-finger-phalanx-distal", "index-finger-tip",
      "middle-finger-metacarpal", "middle-finger-phalanx-proximal", "middle-finger-phalanx-intermediate", "middle-finger-phalanx-distal", "middle-finger-tip",
      "ring-finger-metacarpal", "ring-finger-phalanx-proximal", "ring-finger-phalanx-intermediate", "ring-finger-phalanx-distal", "ring-finger-tip",
      "pinky-finger-metacarpal", "pinky-finger-phalanx-proximal", "pinky-finger-phalanx-intermediate", "pinky-finger-phalanx-distal", "pinky-finger-tip",
    ];

    // El pulgar y el índice son los dedos del pellizco: si también tapan
    // al orbe, justo al acercarte para agarrarlo dejás de verlo y no
    // podés apuntar. Se excluyen de la oclusión; el resto de la mano
    // sigue tapando con normalidad.
    const OCCLUDER_EXCLUDED_JOINTS = new Set(["thumb-tip", "index-finger-tip"]);

    function baseRadiusForJoint(name) {
      if (name === "wrist") return 0.022;
      if (name.endsWith("tip")) return 0.007;
      if (name.endsWith("metacarpal")) return 0.013;
      if (name.endsWith("proximal")) return 0.010;
      if (name.endsWith("intermediate")) return 0.008;
      return 0.0075; // distal
    }

    const OCCLUDER_GEOMETRY = new THREE.SphereGeometry(1, 8, 6); // radio 1: se escala por joint
    const OCCLUDER_MATERIAL = new THREE.MeshBasicMaterial({ colorWrite: false });

    function addHandOccluder(hand) {
      if (hand.userData.occluded) return; // evita duplicar si "connected" vuelve a disparar
      hand.userData.occluded = true;

      for (const jointName of OCCLUDER_JOINT_NAMES) {
        if (OCCLUDER_EXCLUDED_JOINTS.has(jointName)) continue;
        const joint = hand.joints[jointName];
        if (!joint) continue;

        const radius = baseRadiusForJoint(jointName) * CONFIG.OCCLUDER_RADIUS_SCALE;
        const sphere = new THREE.Mesh(OCCLUDER_GEOMETRY, OCCLUDER_MATERIAL);
        sphere.scale.setScalar(radius);
        joint.add(sphere); // hijo del joint: hereda su posición y su visibilidad
      }
    }

    // ------------------------------------------------------------------
    // Manos — se agregan las dos (three.js necesita esto para actualizar
    // los joints), pero solo usamos la que resulte ser la derecha, según
    // el evento "connected" de WebXR (el índice 0/1 no garantiza mano).
    // ------------------------------------------------------------------
    const handCandidates = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    let rightHand = null;

    for (const hand of handCandidates) {
      scene.add(hand);
      hand.addEventListener("connected", (event) => {
        if (event.data.handedness === "right") rightHand = hand;
        addHandOccluder(hand);
      });
      hand.addEventListener("disconnected", () => {
        if (rightHand === hand) rightHand = null;
      });
    }

    // Un solo orbe. Arranca flotando en su posición de reposo (sin lerp
    // inicial desde el origen, para que no "vuele" al entrar en RA).
    const orb = createOrb();
    scene.add(orb);

    const ORB_STATE = {
      FLOATING: "floating",
      HELD: "held",
      SHATTERING: "shattering", // se rompe en sus píxeles al cerrar el puño
      SCANNING: "scanning",     // barrido láser del cuarto en curso
    };
    let orbState = ORB_STATE.FLOATING;
    let wasPinching = false;
    let wasFisting = false;

    // ------------------------------------------------------------------
    // Loop de render — sin asignaciones de memoria por frame
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();
    const _jointPos = new THREE.Vector3();
    const _thumbPos = new THREE.Vector3();
    const _indexPos = new THREE.Vector3();
    const _pinchMid = new THREE.Vector3();
    const _floatAnchor = new THREE.Vector3(
      CONFIG.FLOAT_ANCHOR_X,
      CONFIG.FLOAT_ANCHOR_Y,
      CONFIG.FLOAT_ANCHOR_Z
    );
    orb.position.copy(_floatAnchor);

    // Pellizco de la mano derecha: distancia pulgar-índice. Deja el
    // resultado en variables reutilizadas en vez de devolver un objeto.
    let pinchActive = false;
    function samplePinch() {
      if (!rightHand) {
        pinchActive = false;
        return;
      }
      const thumb = rightHand.joints["thumb-tip"];
      const index = rightHand.joints["index-finger-tip"];
      if (!thumb || !index || !thumb.visible || !index.visible) {
        pinchActive = false;
        return;
      }
      thumb.getWorldPosition(_thumbPos);
      index.getWorldPosition(_indexPos);
      _pinchMid.copy(_thumbPos).add(_indexPos).multiplyScalar(0.5);
      pinchActive = _thumbPos.distanceTo(_indexPos) < CONFIG.PINCH_DISTANCE;
    }

    // Puño cerrado: promedio de distancia muñeca→punta de los 4 dedos
    // (sin el pulgar). Mano abierta = dedos lejos de la muñeca; puño
    // cerrado = dedos curvados cerca de la muñeca.
    const FIST_FINGER_TIPS = [
      "index-finger-tip", "middle-finger-tip", "ring-finger-tip", "pinky-finger-tip",
    ];
    const _wristPos = new THREE.Vector3();
    const _tipPos = new THREE.Vector3();
    let fistActive = false;
    function sampleFist() {
      const wrist = rightHand && rightHand.joints["wrist"];
      if (!wrist || !wrist.visible) {
        fistActive = false;
        return;
      }
      wrist.getWorldPosition(_wristPos);

      let total = 0;
      for (const name of FIST_FINGER_TIPS) {
        const tip = rightHand.joints[name];
        if (!tip || !tip.visible) {
          fistActive = false;
          return;
        }
        tip.getWorldPosition(_tipPos);
        total += _tipPos.distanceTo(_wristPos);
      }
      fistActive = total / FIST_FINGER_TIPS.length < CONFIG.FIST_TIP_TO_WRIST_THRESHOLD;
    }

    // ------------------------------------------------------------------
    // Ruptura del orbe: sus propios píxeles salen disparados hacia afuera
    // (con algo de azar y gravedad) y todo se desvanece; al terminar
    // arranca el escaneo del cuarto.
    // ------------------------------------------------------------------
    function startShatter() {
      orbState = ORB_STATE.SHATTERING;
      orb.userData.shatterElapsed = 0;
      _floatAnchor.copy(orb.position); // el orbe reaparecerá acá cuando termine todo
      clearMaqueta(); // si ya tenía una maqueta adentro, se pierde con esta ruptura

      const plasma = orb.userData.plasma;
      const positions = plasma.points.geometry.attributes.position.array;
      const velocities = plasma.velocities;

      for (let i = 0; i < CONFIG.PLASMA_COUNT; i++) {
        const px = positions[i * 3 + 0];
        const py = positions[i * 3 + 1];
        const pz = positions[i * 3 + 2];
        const len = Math.hypot(px, py, pz) || 1;
        const speed = CONFIG.SHATTER_SPEED * (0.6 + Math.random() * 0.8);

        velocities[i * 3 + 0] = (px / len) * speed + (Math.random() - 0.5) * speed * 0.4;
        velocities[i * 3 + 1] = (py / len) * speed + (Math.random() - 0.5) * speed * 0.4;
        velocities[i * 3 + 2] = (pz / len) * speed + (Math.random() - 0.5) * speed * 0.4;
      }

      plasma.points.material.opacity = 0.9;
      orb.userData.innerGlow.scale.setScalar(1);
    }

    function updateShatter(dt, frame) {
      const plasma = orb.userData.plasma;
      const positions = plasma.points.geometry.attributes.position.array;
      const velocities = plasma.velocities;

      orb.userData.shatterElapsed += dt;
      const t = Math.min(orb.userData.shatterElapsed / CONFIG.SHATTER_DURATION, 1);

      for (let i = 0; i < CONFIG.PLASMA_COUNT; i++) {
        velocities[i * 3 + 1] -= CONFIG.SHATTER_GRAVITY * dt;
        positions[i * 3 + 0] += velocities[i * 3 + 0] * dt;
        positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
        positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;
      }
      plasma.points.geometry.attributes.position.needsUpdate = true;
      plasma.points.material.opacity = 0.9 * (1 - t);
      orb.userData.innerGlow.scale.setScalar(Math.max(0, 1 - t * 1.6));

      if (t >= 1 && frame) {
        orb.visible = false;
        orbState = ORB_STATE.SCANNING;
        startRoomScan(frame);
      }
    }

    // ------------------------------------------------------------------
    // Escaneo del cuarto: lee los planos/mallas que la Quest ya detectó
    // (plane-detection / mesh-detection) y los revela con un barrido tipo
    // láser de piso a techo, con la superficie encendiéndose a su paso.
    // ------------------------------------------------------------------
    const scanState = {
      phase: "sweep", // "sweep" -> "linger" -> "collapse"
      elapsed: 0,
      minY: 0,
      maxY: CONFIG.SCAN_ROOM_HEIGHT,
      surfaces: [],
      sweepMesh: null,
    };
    const _collapseTmp = new THREE.Vector3();

    function createSweepMesh() {
      const geometry = new THREE.RingGeometry(0.02, 3, 48);
      geometry.rotateX(-Math.PI / 2); // horizontal, normal hacia arriba
      const material = new THREE.MeshBasicMaterial({
        color: CONFIG.SCAN_COLOR,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      return new THREE.Mesh(geometry, material);
    }

    function buildPlaneSurface(plane, pose) {
      const points2D = plane.polygon.map((p) => new THREE.Vector2(p.x, p.z));
      const shape = new THREE.Shape(points2D);
      const geometry = new THREE.ShapeGeometry(shape);
      geometry.rotateX(Math.PI / 2); // de XY local a XZ (normal +Y), como espera XRPlane

      const fillMaterial = new THREE.MeshBasicMaterial({
        color: CONFIG.SCAN_COLOR,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const wireMaterial = new THREE.MeshBasicMaterial({
        color: CONFIG.SCAN_COLOR,
        wireframe: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const group = new THREE.Group();
      group.add(new THREE.Mesh(geometry, fillMaterial), new THREE.Mesh(geometry, wireMaterial));

      const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
      m.decompose(group.position, group.quaternion, group.scale);
      scene.add(group);

      return {
        object3d: group,
        materials: [fillMaterial, wireMaterial],
        baseOpacities: [CONFIG.SCAN_FILL_OPACITY, CONFIG.SCAN_WIRE_OPACITY],
        revealY: group.position.y,
        revealed: false,
        revealElapsed: 0,
        originalPosition: group.position.clone(),
        originalScale: group.scale.clone(),
      };
    }

    function buildMeshSurface(mesh, pose) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(mesh.vertices, 3));
      geometry.setIndex(new THREE.BufferAttribute(mesh.indices, 1));

      const material = new THREE.MeshBasicMaterial({
        color: CONFIG.SCAN_COLOR,
        wireframe: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const wireMesh = new THREE.Mesh(geometry, material);

      const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
      m.decompose(wireMesh.position, wireMesh.quaternion, wireMesh.scale);
      scene.add(wireMesh);

      return {
        object3d: wireMesh,
        materials: [material],
        baseOpacities: [CONFIG.SCAN_WIRE_OPACITY],
        revealY: wireMesh.position.y,
        revealed: false,
        revealElapsed: 0,
        originalPosition: wireMesh.position.clone(),
        originalScale: wireMesh.scale.clone(),
      };
    }

    function disposeSurface(surface) {
      scene.remove(surface.object3d);
      surface.object3d.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
      });
      for (const material of surface.materials) material.dispose();
    }

    function startRoomScan(frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();

      scanState.surfaces.forEach(disposeSurface);
      scanState.surfaces.length = 0;

      let minY = Infinity;
      let maxY = -Infinity;

      const planes = frame.detectedPlanes;
      if (planes) {
        for (const plane of planes) {
          const pose = frame.getPose(plane.planeSpace, referenceSpace);
          if (!pose) continue;
          const surface = buildPlaneSurface(plane, pose);
          scanState.surfaces.push(surface);
          minY = Math.min(minY, surface.revealY);
          maxY = Math.max(maxY, surface.revealY);
        }
      }

      const meshes = frame.detectedMeshes;
      if (meshes) {
        for (const mesh of meshes) {
          const pose = frame.getPose(mesh.meshSpace, referenceSpace);
          if (!pose) continue;
          const surface = buildMeshSurface(mesh, pose);
          scanState.surfaces.push(surface);
          minY = Math.min(minY, surface.revealY);
          maxY = Math.max(maxY, surface.revealY);
        }
      }

      if (!isFinite(minY)) {
        // sin plane-detection / mesh-detection soportados o sin Space
        // Setup hecho en la Quest: igual se ve el barrido, solo que no
        // enciende ninguna superficie real.
        minY = orb.position.y - 1;
        maxY = orb.position.y + 1;
      }

      scanState.minY = minY;
      scanState.maxY = Math.max(maxY, minY + 0.5);
      scanState.elapsed = 0;
      scanState.phase = "sweep";

      if (!scanState.sweepMesh) scanState.sweepMesh = createSweepMesh();
      scanState.sweepMesh.material.opacity = 0.5;
      scanState.sweepMesh.position.set(_floatAnchor.x, minY, _floatAnchor.z);
      scene.add(scanState.sweepMesh);
    }

    function updateScan(dt) {
      scanState.elapsed += dt;

      if (scanState.phase === "sweep") {
        const t = Math.min(scanState.elapsed / CONFIG.SCAN_SWEEP_DURATION, 1);
        const sweepY = THREE.MathUtils.lerp(scanState.minY, scanState.maxY, t);
        scanState.sweepMesh.position.y = sweepY;

        for (const surface of scanState.surfaces) {
          if (!surface.revealed && sweepY >= surface.revealY) {
            surface.revealed = true;
          }
          if (surface.revealed && surface.revealElapsed < CONFIG.SCAN_SURFACE_FADE_IN) {
            surface.revealElapsed += dt;
            const revealT = Math.min(surface.revealElapsed / CONFIG.SCAN_SURFACE_FADE_IN, 1);
            for (let i = 0; i < surface.materials.length; i++) {
              surface.materials[i].opacity = surface.baseOpacities[i] * revealT;
            }
          }
        }

        if (t >= 1) {
          scanState.phase = "linger";
          scanState.elapsed = 0;
        }
      } else if (scanState.phase === "linger") {
        if (scanState.elapsed >= CONFIG.SCAN_LINGER) {
          scanState.phase = "collapse";
          scanState.elapsed = 0;
        }
      } else if (scanState.phase === "collapse") {
        // el cuarto entero se encoge hacia _floatAnchor (zoom a miniatura)
        // en vez de desvanecerse: termina como una maqueta chica del cuarto
        const t = Math.min(scanState.elapsed / CONFIG.MAQUETTE_COLLAPSE_DURATION, 1);
        const scaleFactor = THREE.MathUtils.lerp(1, CONFIG.MAQUETTE_SCALE, t);

        for (const surface of scanState.surfaces) {
          _collapseTmp
            .copy(surface.originalPosition)
            .sub(_floatAnchor)
            .multiplyScalar(scaleFactor)
            .add(_floatAnchor);
          surface.object3d.position.copy(_collapseTmp);
          surface.object3d.scale.copy(surface.originalScale).multiplyScalar(scaleFactor);
        }

        scanState.sweepMesh.material.opacity = 0.5 * (1 - t);

        if (t >= 1) finishMaquette();
      }
    }

    // La maqueta (superficies ya encogidas) pasa a ser hija permanente del
    // orbe — "se mete adentro" y viaja con él de ahí en más.
    function finishMaquette() {
      scene.remove(scanState.sweepMesh);

      clearMaqueta(); // por si ya había una maqueta de un escaneo anterior

      orb.userData.maquetaObjects = scanState.surfaces.map((s) => s.object3d);
      for (const object3d of orb.userData.maquetaObjects) {
        orb.attach(object3d); // cambia de padre conservando su transform de mundo
      }
      scanState.surfaces.length = 0;

      orb.userData.innerGlow.scale.setScalar(1);
      orb.userData.plasma.points.material.opacity = 0.9;
      orb.position.copy(_floatAnchor);
      orb.visible = true;
      orbState = ORB_STATE.FLOATING;
    }

    function clearMaqueta() {
      if (!orb.userData.maquetaObjects) return;
      for (const object3d of orb.userData.maquetaObjects) {
        orb.remove(object3d);
        object3d.traverse((child) => {
          if (!child.isMesh) return;
          child.geometry.dispose();
          child.material.dispose();
        });
      }
      orb.userData.maquetaObjects = null;
    }

    // Estados FLOATING / HELD: pellizco para agarrar/soltar, puño para
    // romper el orbe y arrancar el escaneo.
    function updateCarry(dt, elapsedTime) {
      const lerpAlpha = 1 - Math.exp(-CONFIG.SMOOTHING_RATE * dt);

      samplePinch();
      sampleFist();
      const pinchStarted = pinchActive && !wasPinching;
      const fistStarted = fistActive && !wasFisting;
      wasPinching = pinchActive;
      wasFisting = fistActive;

      if (orbState === ORB_STATE.FLOATING && pinchStarted) {
        if (_pinchMid.distanceTo(orb.position) < CONFIG.GRAB_RADIUS) {
          orbState = ORB_STATE.HELD; // lo agarraste
        }
      } else if (orbState === ORB_STATE.HELD) {
        if (pinchStarted) {
          orbState = ORB_STATE.FLOATING; // te lo quitaste: queda flotando ahí mismo
          _floatAnchor.copy(orb.position);
        } else if (fistStarted) {
          startShatter();
          return; // el resto lo maneja updateShatter desde el próximo frame
        }
      }

      if (orbState === ORB_STATE.HELD) {
        const joint = rightHand && rightHand.joints[CONFIG.HAND_JOINT];
        if (joint && joint.visible) {
          joint.getWorldPosition(_jointPos);
          _jointPos.y += CONFIG.ORB_OFFSET_Y;
          orb.position.lerp(_jointPos, lerpAlpha);
        }
        // si se pierde el tracking de la mano, el orbe se queda quieto
      } else {
        _jointPos.copy(_floatAnchor);
        _jointPos.y += Math.sin(elapsedTime * CONFIG.FLOAT_BOB_SPEED) * CONFIG.FLOAT_BOB_AMPLITUDE;
        orb.position.lerp(_jointPos, lerpAlpha);
      }

      updatePlasma(orb.userData.plasma, elapsedTime);
    }

    function render(time, frame) {
      const dt = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      switch (orbState) {
        case ORB_STATE.FLOATING:
        case ORB_STATE.HELD:
          updateCarry(dt, elapsedTime);
          break;
        case ORB_STATE.SHATTERING:
          updateShatter(dt, frame);
          break;
        case ORB_STATE.SCANNING:
          updateScan(dt);
          break;
      }

      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(render);

    // ------------------------------------------------------------------
    // UI: entrada / salida de sesión y manejo de "no soportado"
    // ------------------------------------------------------------------
    const overlay = document.getElementById("overlay");
    const enterButton = document.getElementById("enter-ar");
    const statusEl = document.getElementById("xr-status");

    function showUnsupported(message) {
      statusEl.textContent = message;
      enterButton.disabled = true;
    }

    if (!navigator.xr) {
      showUnsupported(
        "WebXR no está disponible en este navegador. Abrí esta página en el navegador del Meta Quest."
      );
    } else {
      navigator.xr.isSessionSupported("immersive-ar").then((supported) => {
        if (!supported) {
          showUnsupported("Este dispositivo no soporta realidad aumentada (immersive-ar).");
        }
      });
    }

    async function enterAR() {
      statusEl.textContent = "";
      try {
        const session = await navigator.xr.requestSession("immersive-ar", {
          optionalFeatures: ["hand-tracking", "local-floor", "plane-detection", "mesh-detection"],
        });

        renderer.xr.addEventListener("sessionend", onSessionEnd, { once: true });

        await renderer.xr.setSession(session);
        overlay.style.display = "none";
      } catch (err) {
        showUnsupported("No se pudo iniciar la sesión de RA: " + err.message);
      }
    }

    function onSessionEnd() {
      overlay.style.display = "flex";
    }

    enterButton.addEventListener("click", enterAR);
  </script>
</body>
</html>
